# qeet-id-hosted — repository context metadata (Level 2).
schema_version: 1
context: {type: repository, level: L2, canonical: true, last_verified: "2026-10-24"}
inheritance:
  organization: {repository: qeetgroup/qeet-context, level: L0}
  product:      {repository: qeetgroup/qeet-id-context, level: L1}
repository:
  name: qeet-id-hosted   # formerly qeet-id-login; the release image keeps that name until QTID-955
  product: qeet-id
  type: frontend
  role: primary
  status: active
  visibility: private
  default_branch: main
  working_branch: develop
  host: accounts.id.qeet.in   # formerly login.id.qeet.in, which redirects here (QTID-957)
runtime:
  language: TypeScript
  framework: Next.js 16.2.6      # App Router, React Compiler
  react: "^19.2.6"
  package_manager: bun@1.3.14
  lint_format: "@biomejs/biome 2.5.15"   # biome.json
  design_system: "@qeetrix/ui 2.1.5"     # pinned exactly; icons from @qeetrix/icons 1.0.11
  dev_port: 3003                          # REQUIRED — backend allowlists it
architecture:
  style: stateless-thin-client
  statement: "holds no database and no secrets — every action is an API call"
  routes: [/sign-in, /sign-up, /forgot-password, /reset-password, /magic-link, /consent, /device, /sign-out, /sign-out/done, /enterprise-setup, /security]
  legacy_redirects: {/login: /sign-in, /signup: /sign-up, /logout: /sign-out, /logged-out: /sign-out/done, /reset: /reset-password, /magic: /magic-link, /admin-portal: /enterprise-setup}   # next.config.ts; server + sent emails still use the old paths
  src: [src/app, src/modules, src/platform, src/i18n, src/testing]
  layers: "app → modules → platform → i18n; a module never imports another (biome.json)"
  guardrails: [biome noRestrictedImports, fetch only in platform/api, 500-line files, translation keys, coverage floor, server-only]
contracts:
  consumes: {api: qeet-id-server}
  base_url_env: PUBLIC_API_URL    # runtime (src/platform/config/public-config.ts); falls back to build-time NEXT_PUBLIC_API_URL (Vercel)
  base_url_default: http://localhost:4001
  auth_scheme: HttpOnly cookies + CSRF double-submit
  session_cookie: qe_ls          # interactive login; enterprise setup has its own scoped cookie
  csrf: {cookie: qe_csrf, header: X-CSRF-Token, seed: "GET /healthz"}
role_in_product:
  statement: "The ONLY host where an interactive Qeet ID session is established."
  flows: [password, passkey, social, MFA, sign-up, recovery, OAuth consent, device grant, enterprise setup]
commands:
  dev:   bun run dev -- -p 3003
  build: bun run build
  typecheck: bun run typecheck
  test: bun run test
  check: bun run check            # Biome: format + lint + import order
  test_e2e: bun run test:e2e      # Playwright: each page's CSP + WCAG 2.2 AA (axe)
ci:
  workflows: [ci.yml, deploy.yml]
  jobs: [verify, e2e, image, deploy]   # verify = typecheck + check + test:coverage + build; e2e = test:e2e
  runner: ubuntu-latest
  deploy: push main -> gate -> vercel build/deploy --prod -> tag vX.Y.Z + GitHub release (release/x.y.z merge -> exactly vx.y.z; job runs only on main)
  release_image: "ci.yml job `image` — push to release/** after verify: ghcr.io/qeetgroup/qeet-id-login:sha-<commit> (the former name, which qeet-id-kit reads, until QTID-955), linux/amd64+arm64 (consumed by the Qeet ID Kit, qeet-id-kit)"
container:
  dockerfile: Dockerfile          # Next standalone server; not used by Vercel production
  runtime_env: [PUBLIC_API_URL, PORT, HOSTNAME]
  health: GET /healthz -> 200
security:
  sensitive_paths:
    - src/platform/api/client.ts # CSRF seeding + credentials: include
    - src/modules/enterprise-setup/components/enterprise-setup-page.tsx   # one-time fragment exchange
    - src/modules/enterprise-setup/api/admin-portal.ts                     # then cookie-only requests
    - src/proxy.ts                                                         # per-request nonce CSP
    - src/platform/security/                                               # CSP + security headers
  never: [store a token, weaken CSRF, log an enterprise-setup link token, unsafe redirect, relax the CSP, inline script without the nonce]
  headers: "CSP per request (nonce, strict-dynamic, frame-ancestors 'none'); Referrer-Policy no-referrer; nosniff; X-Frame-Options DENY; Permissions-Policy"
  startup_check: src/instrumentation.ts   # malformed PUBLIC_API_URL / LOGIN_TRUSTED_PROXY_HOPS / QEET_ID_RELAY_KEY → every request fails, log names it
llm_context:
  primary_instructions: AGENTS.md
  canonical: docs/llm/context.md
  boundaries: docs/llm/boundaries.md
  workflows: docs/llm/workflows.md
  architecture_map: docs/llm/architecture-map.md
  adapters: [CLAUDE.md, GEMINI.md, .github/copilot-instructions.md]
