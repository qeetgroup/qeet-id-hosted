# qeet-id-login — repository context metadata (Level 2).
schema_version: 1
context: {type: repository, level: L2, canonical: true, last_verified: "2026-08-28"}
inheritance:
  organization: {repository: qeetgroup/qeet-context, level: L0}
  product:      {repository: qeetgroup/qeet-id-context, level: L1}
repository:
  name: qeet-id-login
  product: qeet-id
  type: frontend
  role: primary
  status: active
  visibility: private
  default_branch: main
  working_branch: develop
  host: login.id.qeet.in
runtime:
  language: TypeScript
  framework: Next.js 16.2.6      # App Router, React Compiler
  react: "^19.2.6"
  package_manager: bun@1.3.14
  design_system: "@qeetrix/ui ^1.0.2"    # npm latest is 2.0.0 — a major behind
  dev_port: 3003                          # REQUIRED — backend allowlists it
architecture:
  style: stateless-thin-client
  statement: "holds no database and no secrets — every action is an API call"
  routes: [/login, /signup, /forgot-password, /reset, /consent, /device, /logged-out, /admin-portal]
  src: [src/app, src/components, src/lib, src/i18n]
contracts:
  consumes: {api: qeet-id-server}
  base_url_env: PUBLIC_API_URL    # runtime (src/lib/public-config.ts); falls back to build-time NEXT_PUBLIC_API_URL (Vercel)
  base_url_default: http://localhost:4001
  auth_scheme: HttpOnly cookies + CSRF double-submit
  session_cookie: qe_ls          # interactive login; admin portal has its own scoped cookie
  csrf: {cookie: qe_csrf, header: X-CSRF-Token, seed: "GET /healthz"}
role_in_product:
  statement: "The ONLY host where an interactive Qeet ID session is established."
  flows: [password, passkey, social, MFA, signup, recovery, OAuth consent, device grant, admin portal]
  not_implemented: [magic-link consumption]   # lives in qeet-id-console
commands:
  dev:   bun run dev -- -p 3003
  build: bun run build
  typecheck: bun run typecheck
ci:
  workflows: [ci.yml, deploy.yml]
  jobs: [verify, image, deploy]   # verify = typecheck + build (push develop/release/**, PRs)
  runner: ubuntu-latest
  deploy: push main -> gate -> vercel build/deploy --prod -> tag vX.Y.Z + GitHub release (release/x.y.z merge -> exactly vx.y.z; job runs only on main)
  release_image: "ci.yml job `image` — push to release/** after verify: ghcr.io/qeetgroup/qeet-id-login:sha-<commit>, linux/amd64+arm64 (consumed by the qeet-id-deploy test kit)"
container:
  dockerfile: Dockerfile          # Next standalone server; not used by Vercel production
  runtime_env: [PUBLIC_API_URL, PORT, HOSTNAME]
  health: GET /healthz -> 200
security:
  sensitive_paths:
    - src/lib/api.ts             # CSRF seeding + credentials: include
    - src/lib/admin-portal.ts    # one-time fragment exchange, then cookie-only requests
  never: [store a token, weaken CSRF, log an admin-portal token, unsafe redirect]
llm_context:
  primary_instructions: AGENTS.md
  canonical: docs/llm/context.md
  boundaries: docs/llm/boundaries.md
  workflows: docs/llm/workflows.md
  architecture_map: docs/llm/architecture-map.md
  adapters: [CLAUDE.md, GEMINI.md, .github/copilot-instructions.md]
