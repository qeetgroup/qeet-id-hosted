# SonarQube analysis of the hosted sign-in app, on the local SonarQube qeet-id-server runs (make
# sonar-up there): `bun run sonar` runs the unit tests with coverage, then the scanner. Generated
# code, the copied API documents, copy, static files and build output are left out, and so are .env
# and .env.* by name, so local keys are never analysed even if the scanner can't read .gitignore.
sonar.projectKey=qeet-id-hosted
sonar.projectName=Qeet ID hosted sign-in
sonar.sourceEncoding=UTF-8

# A file is code or a test, never both: tests are left out of the code.
sonar.sources=src,scripts
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,src/testing/**,src/platform/api/contract/generated/*.gen.ts,src/i18n/locales/**,contract/**,**/node_modules/**,coverage/**,.next/**,test-results/**,playwright-report/**,**/.env,**/.env.*
sonar.tests=src,scripts,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,src/testing/**,tests/**
sonar.test.exclusions=**/node_modules/**,**/.env,**/.env.*

# Coverage from `bun run test:coverage`, which measures src only: the build scripts and type
# declarations have none to report.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=scripts/**,**/*.d.ts,**/*.d.mts

# The type-aware TypeScript rules read the project's types.
sonar.typescript.tsconfigPaths=tsconfig.json

sonar.working.directory=.scannerwork
